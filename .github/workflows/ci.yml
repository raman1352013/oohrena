name: CI

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Cache MongoDB memory server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-binaries-${{ hashFiles('apps/api/package.json') }}
          restore-keys: |
            ${{ runner.os }}-mongodb-binaries-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Test (all workspaces)
        run: npm test

      - name: Build API
        run: npm run build -w @oohrena/api

      - name: Build Web
        run: npm run build -w @oohrena/web

      - name: Web Lint
        run: npm run lint -w @oohrena/web
