# Render Blueprint for the OOHRENA API (Render dashboard → New → Blueprint → pick this repo).
# Secrets are marked `sync: false`: Render asks for them on first deploy and they live only in Render.
services:
  - type: web
    name: oohrena-api
    runtime: node
    region: singapore # closest Render region to India
    plan: starter # free instances sleep and lose the local disk; use a paid plan for anything real
    branch: main
    buildCommand: npm ci --include=dev && npm run build -w @oohrena/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/v1/system/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV # staging until SMTP is set up; production refuses to start without SMTP_URL
        value: staging
      - key: MONGOMS_DISABLE_POSTINSTALL # test-only MongoDB binary; skip the 370 MB download during build
        value: "1"
      - key: TRUST_PROXY # browser → Vercel edge → Render proxy → API
        value: "2"
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: SMTP_URL
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Uploads go to MongoDB (GridFS) unless S3_BUCKET is set; Render's own disk is wiped on every deploy.
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: REQUIRE_2FA_PRIVILEGED
        value: "false" # switch to "true" once every admin/finance user has enrolled
